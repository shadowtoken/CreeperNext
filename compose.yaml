name: creeper-next

# Development only. These public local credentials are not production secrets.
services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: creeper
      POSTGRES_PASSWORD: creeper_local_only
      POSTGRES_DB: creeper
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creeper -d creeper"]
      interval: 2s
      timeout: 5s
      retries: 15

  db-test:
    image: postgres:18.4-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: creeper
      POSTGRES_PASSWORD: creeper_test_only
      POSTGRES_DB: creeper_test
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creeper -d creeper_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
